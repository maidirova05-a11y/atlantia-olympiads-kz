.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .in{max-width:1220px;margin:0 auto;padding:0 20px;height:68px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none}
.tools{display:flex;align-items:center;gap:10px}
.lang{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.lang button{background:none;border:0;color:var(--muted);padding:6px 10px;font:800 12px var(--sans);letter-spacing:.06em;cursor:pointer}
.lang button.on{background:var(--acc);color:var(--bg)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:700 13px var(--sans);text-decoration:none;cursor:pointer}
.btn:hover{border-color:var(--acc)}
main{max-width:1220px;margin:0 auto;padding:44px 20px 80px;min-height:calc(100vh - 260px)}
.upd{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--head);font-size:clamp(34px,5vw,54px);line-height:1.08;margin:10px 0 30px}
footer{max-width:1220px;margin:0 auto;padding:0 20px 50px;font-size:14px;color:var(--muted)}
[hidden]{display:none!important}

/* ---------- results cabinet ----------
   Wide screens: heading on the left, the form card on the right; the cabinet spans the full width
   with each child's details beside the certificate. */
@media (min-width:960px){
  main{display:grid;grid-template-columns:minmax(0,1fr) 460px;column-gap:clamp(40px,6vw,96px);align-items:start;padding-top:72px}
  main>.r-head{margin:0}
  main>[data-view=request],main>[data-view=login]{max-width:none;margin-top:6px}
  main.v-cab{display:block;padding-top:44px}
  main.v-cab>.r-head{margin-bottom:26px}
  .r-head h1{font-size:clamp(40px,4.2vw,58px)}
}
@media (min-width:1000px){
  .person{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:0 44px;align-items:start}
  .person .cert{margin-top:0;padding-top:0;border-top:0}
  .person .facts{flex-direction:column;gap:14px}
}
.r-head{margin-bottom:26px}
.r-head h1{margin:8px 0 12px}
.r-head p.sub{color:var(--muted);max-width:640px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:34px clamp(20px,5vw,44px)}
.card h2{font-family:var(--head);line-height:1.2;margin:0}
.narrow{max-width:480px}
label{display:block;font-weight:700;font-size:14px;margin:0 0 6px}
input[type=email],input[type=password],input[type=text]{width:100%;font:500 17px var(--sans);color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;outline:none;transition:border-color .2s}
input:focus{border-color:var(--acc)}
input[aria-invalid=true]{border-color:var(--coral)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
input.code{letter-spacing:.12em;font-size:19px;font-weight:700}
.field{margin-bottom:16px}
.hint{font-size:13.5px;color:var(--muted);margin-top:6px;line-height:1.5}
.b{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:12px;font:800 15px var(--sans);text-decoration:none;border:1.5px solid var(--line);color:var(--ink);background:var(--card);cursor:pointer}
.b:hover{border-color:var(--acc)}
.b-red{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.b-red:hover{border-color:var(--acc);filter:brightness(1.08)}
.b:disabled{opacity:.55;cursor:default}
.b.busy{cursor:progress}
.b svg{width:18px;height:18px}
.link{background:none;border:0;padding:10px 0;min-height:44px;font:700 14px var(--sans);color:var(--acc);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.link:disabled{color:var(--muted);cursor:default;text-decoration:none}
.row{display:flex;flex-wrap:wrap;gap:0 20px;align-items:center;margin-top:8px}
.msg{margin:0 0 16px;padding:12px 15px;border-radius:12px;font-size:14.5px;line-height:1.5}
.msg.err{background:rgba(255,122,89,.14);color:#FFB8A5}
.msg.ok{background:rgba(47,227,210,.12);color:#8CF0E6}
.muted{color:var(--muted)}
.cab-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.cab-top h2{font-family:var(--head);font-size:26px}
.cab-top .who{overflow-wrap:anywhere;font-size:14px;color:var(--muted)}
.cab-top .who b{color:var(--ink);font-weight:700}
.person{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px clamp(20px,5vw,40px);margin-bottom:20px}
.p-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}
.p-head h2{font-family:var(--head);font-size:clamp(20px,2.4vw,27px);line-height:1.25;overflow-wrap:anywhere}
.p-head p{margin-top:6px;font-size:15px}
.score{flex:none;text-align:center;background:color-mix(in srgb,var(--acc) 10%,transparent);border:1px solid var(--line);border-radius:16px;padding:12px 18px;min-width:116px}
.score span,.score small{font-size:13px;font-weight:700;color:var(--muted)}
.score span{display:block}
.score b{display:block;font-family:var(--head);font-weight:600;font-size:44px;line-height:1.05;color:var(--acc)}
.facts{display:flex;flex-wrap:wrap;gap:10px 34px;margin:18px 0 0}
.facts dt{font-size:13px;color:var(--muted);font-weight:700}
.facts dd{font-weight:700}
.final{display:flex;gap:14px;align-items:flex-start;margin-top:20px;padding:16px 18px;border-radius:14px;border:1.5px solid var(--acc);background:color-mix(in srgb,var(--acc) 9%,transparent)}
.final svg{flex:none;width:30px;height:30px;color:var(--acc);margin-top:2px}
.final b{display:block;font-family:var(--head);font-size:16px;font-weight:600;line-height:1.35;color:var(--ink)}
.final p{margin-top:4px;font-size:14.5px;line-height:1.5;color:var(--muted)}
.cert{margin-top:24px;padding-top:22px;border-top:1px solid var(--line)}
.cert-bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 12px;margin-bottom:14px}
.cert-bar h3{font-size:16px;font-weight:700}
.cert-img{aspect-ratio:3510/2482;border-radius:10px;overflow:hidden;background:var(--bg);display:grid;place-items:center;border:1px solid var(--line)}
.cert-img img{width:100%;height:100%;display:block}
.cert-img.loading img{opacity:.5}
.cert-dl{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.pw-card h2{font-size:22px;margin-bottom:16px}
@media (max-width:640px){.btn span{display:none}.top .in{gap:8px;padding:0 14px}.tools{gap:6px}.lang button{padding:6px 7px}.btn{padding:8px 10px}.p-head{flex-direction:column}.score{align-self:stretch;display:flex;align-items:baseline;justify-content:center;gap:10px}.score b{font-size:36px}.cert-dl .b{flex:1}main{padding-bottom:110px}}
@media (max-width:420px){.cert-dl{flex-direction:column}.cert-dl .b{width:100%}}
.pending [data-view]{visibility:hidden}

/* ---------- section menu ---------- */
.snav{max-width:1220px;margin:0 auto;padding:0 14px 10px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
.snav.end{mask-image:none;-webkit-mask-image:none}
.snav::-webkit-scrollbar{display:none}
.snav a{flex:none;padding:6px 12px;border-radius:9px;font:700 13.5px var(--sans);color:var(--muted);text-decoration:none;transition:color .2s,background .2s}
.snav a:hover{color:var(--ink);background:color-mix(in srgb,var(--acc) 10%,transparent)}
.snav a[aria-current]{color:var(--acc)}

/* ---------- WhatsApp: round button in the corner (no consultation button on subpages) ---------- */
@keyframes waPulse{0%{box-shadow:0 0 0 0 rgba(37,211,102,.65)}70%,100%{box-shadow:0 0 0 18px rgba(37,211,102,0)}}
.wa-fab{position:fixed;right:20px;bottom:20px;z-index:80;width:62px;height:62px;border-radius:50%;background:#25D366;display:grid;place-items:center;box-shadow:0 14px 34px -10px rgba(37,211,102,.75);transition:transform .25s,opacity .5s,box-shadow .25s}
.wa-fab:hover{transform:translateY(-3px);box-shadow:0 18px 40px -10px rgba(37,211,102,.9)}
.wa-fab svg{width:32px;height:32px;fill:#fff}
.wa-fab::after{content:"";position:absolute;inset:0;border-radius:50%;animation:waPulse 2.2s infinite}
@media (max-width:680px){.wa-fab{right:12px;bottom:12px;width:52px;height:52px}.wa-fab svg{width:27px;height:27px}}
@media (prefers-reduced-motion:reduce){.wa-fab::after{animation:none}}
@media print{.top,.snav,.wa-fab,footer{display:none}}
